  <style>
    body { margin: 0; }
    a { color: #C43C3C; } a:hover { color: #C43C3C; }
    .slide { width: 1080px; height: 1350px; background: #F1F4FA; color: #12203A; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 88px 84px; box-sizing: border-box; }

    .marca img { height: 52px; display: block; }

    .pag { font: 600 22px 'Plus Jakarta Sans', system-ui, sans-serif; color: #6E80A0; }
    .vai { font: 600 26px 'Plus Jakarta Sans', system-ui, sans-serif; color: #C43C3C; }
    h1 { font: 600 104px/1.07 'Newsreader', Georgia, serif; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
    h2 { font: 600 72px/1.12 'Newsreader', Georgia, serif; letter-spacing: -0.02em; margin: 0 0 32px; }
    .num { font: 700 26px 'Plus Jakarta Sans', system-ui, sans-serif; color: #C43C3C; letter-spacing: 0.14em; margin: 0 0 28px; }
    .txt { font: 400 42px/1.55 'Inter', system-ui, sans-serif; color: #46587A; margin: 0; }
    .grifo { background: #F6FF74; color: #12203A; padding: 0 16px 8px; margin-inline: -4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .pill { display: inline-flex; align-items: center; justify-content: center; background: #C43C3C; color: #FFFFFF; font: 700 36px 'Plus Jakarta Sans', system-ui, sans-serif; padding: 30px 56px; border-radius: 999px; }
