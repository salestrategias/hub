<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{padding:28px;background:var(--bg)}.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;font-family:var(--sans);font-size:11px}.pal div{height:72px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:8px;color:#fff}.pal b{font-weight:600}.leg{color:var(--muted);margin-top:14px;font-size:13px}</style>
<div class="pal">
  <div style="background:#0B1526"><b>--bg</b></div>
  <div style="background:#0F1E3A"><b>--bg-2</b></div>
  <div style="background:#152848"><b>--surface</b></div>
  <div style="background:#1B3156"><b>--surface-2</b></div>
  <div style="background:#29426B"><b>--line</b></div>
  <div style="background:#3D6FE0"><b>--violet</b></div>
  <div style="background:#FF6B66;color:#12203A"><b>--gold</b></div>
  <div style="background:#FF8D85;color:#12203A"><b>--gold-light</b></div>
  <div style="background:#C43C3C"><b>--gold-deep</b></div>
  <div style="background:#F1F4FA;color:#12203A"><b>--bone</b></div>
  <div style="background:#F6FF74;color:#12203A"><b>--lima</b></div>
  <div style="background:#AEBCD6;color:#12203A"><b>--muted</b></div>
</div>
<p class="leg">Escada de 4 fundos marinho, UMA borda (--line), coral como único acento (≤5% da tela), lima apenas em marca-texto e seleção.</p>
