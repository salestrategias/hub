# =============================================================================
# SAL — regras do site novo para NGINX (CloudPanel)
#
# Onde colar: CloudPanel (https://SEU-IP:8443) → Sites → www.salestrategias.com.br
# → aba "Vhost Editor" → dentro do bloco server { ... }, logo ANTES das
# locations que já existem. Salvar; o CloudPanel recarrega o nginx sozinho.
#
# O que isto faz é o mesmo que o .htaccess fazia no Apache:
#   1. a home passa a ser o index.html novo (o index.php continua para o resto)
#   2. as URLs antigas do WordPress ganham 301 para as páginas novas
#   3. cabeçalhos de segurança
#   4. cache longo para arquivos com hash no nome
#   5. página de erro 404 do site novo
# =============================================================================

# ---- 1. home nova -----------------------------------------------------------
location = / {
    try_files /index.html /index.php?$args;
}

# ---- 2. redirecionamentos das páginas antigas -------------------------------
rewrite ^/servicos/gestao-de-trafego-pago/?$                   /trafego-pago/       permanent;
rewrite ^/servicos/anunciar-no-google-ads-e-instagram/?$       /trafego-pago/       permanent;
rewrite ^/servicos/aparecer-no-google-meu-negocio/?$           /seo-local/          permanent;
rewrite ^/servicos/assessoria-de-google-meu-negocio/?$         /seo-local/          permanent;
rewrite ^/servicos/como-melhorar-o-posicionamento-no-google/?$ /seo-local/          permanent;
rewrite ^/servicos/agencia-de-seo/?$                           /seo-para-ecommerce/ permanent;
rewrite ^/servicos/seo-para-ecommerce/?$                       /seo-para-ecommerce/ permanent;
rewrite ^/servicos/como-aumentar-vendas-no-e-commerce/?$       /e-commerce/         permanent;
rewrite ^/servicos/estruturacao-de-ecommerce/?$                /e-commerce/         permanent;
rewrite ^/servicos/criacao-de-sites/?$                         /diagnostico-de-site/ permanent;
rewrite ^/servicos/agencia-de-producao-de-conteudo/?$          /seo-para-ecommerce/ permanent;
rewrite ^/servicos/consultoria/?$                              /quem-somos/         permanent;
rewrite ^/servicos/?$                                          /quem-somos/         permanent;
rewrite ^/diagnostico/?$                                       /agenda/             permanent;
rewrite ^/contato/?$                                           /agenda/             permanent;
rewrite ^/newsletter/?$                                        /blog/               permanent;
rewrite ^/home-v6/?$                                           /                    permanent;
rewrite ^/home-v7/?$                                           /                    permanent;

# ---- 3. segurança -----------------------------------------------------------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://script.google.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.salestrategias.com.br https://salestrategias.com.br https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.salestrategias.com.br https://salestrategias.com.br https://script.google.com https://script.googleusercontent.com https://www.google-analytics.com https://region1.google-analytics.com; upgrade-insecure-requests" always;

# ---- 4. cache dos arquivos com hash -----------------------------------------
location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# ---- 5. página de erro do site novo -----------------------------------------
error_page 404 /404.html;
