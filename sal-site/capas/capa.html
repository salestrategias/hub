<!doctype html>
<!-- Capa de post do Blog da SAL.
     Parâmetros: ?titulo=...&grifo=trecho a grifar&cat=Editoria&min=7&formato=post|social
     Gere o PNG com: node gerar.mjs "Título" --grifo "trecho" --cat "Tráfego pago" --min 7 -->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Capa</title>
<style>
  @font-face { font-family: 'Newsreader'; src: url('../public/fonts/newsreader-600.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('../public/fonts/plus-jakarta-sans-var.woff2') format('woff2'); font-weight: 200 800; }
  html, body { margin: 0; }
  .capa {
    position: relative; overflow: hidden; width: 1200px; height: 675px;
    background: #0B1526; color: #FFF;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 60px 72px 56px; box-sizing: border-box;
  }
  .capa::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(56% 74% at 84% 12%, rgba(61,111,224,.34) 0%, transparent 70%),
      radial-gradient(48% 66% at 10% 92%, rgba(255,107,102,.22) 0%, transparent 70%);
  }
  .capa > * { position: relative; }
  .topo { display: flex; align-items: center; justify-content: space-between; }
  .rotulo { display: inline-flex; align-items: center; gap: 12px; font: 600 21px 'Plus Jakarta Sans'; letter-spacing: .16em; text-transform: uppercase; color: #FF6B66; }
  .rotulo i, .graos i { width: 9px; height: 9px; background: #FF6B66; transform: rotate(45deg); }
  .graos { display: flex; gap: 16px; }
  .graos i { width: 11px; height: 11px; }
  .graos i:nth-child(2) { opacity: .6; } .graos i:nth-child(3) { opacity: .3; }
  h1 { font: 600 88px/1.06 'Newsreader', Georgia, serif; letter-spacing: -0.02em; max-width: 1000px; margin: 0; text-wrap: balance; font-variation-settings: 'opsz' 96; }
  h1 .grifo { background: #F6FF74; color: #12203A; padding: 0 16px 8px; margin-inline: -4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .pe { display: flex; align-items: flex-end; justify-content: space-between; }
  .marca { display: flex; align-items: center; gap: 20px; }
  .marca img { height: 56px; display: block; }
  .marca span { font: 600 20px 'Plus Jakarta Sans'; color: #AEBCD6; border-left: 1px solid #29426B; padding-left: 20px; }
  .meta { font: 600 20px 'Plus Jakarta Sans'; color: #7688A6; }
  .social .capa, body.social .capa { width: 1080px; height: 1080px; padding: 72px 76px; }
  body.social h1 { font-size: 96px; max-width: 900px; }
  /* card de rede: chão liso, sem véus — degradê em card é clichê de IA */
  body.social .capa::before { content: none; }
</style></head>
<body>
  <div class="capa">
    <div class="topo">
      <span class="rotulo"><i></i><b id="cat" style="font-weight:600">Editoria</b></span>
      <span class="graos"><i></i><i></i><i></i></span>
    </div>
    <h1 id="titulo">Título do artigo</h1>
    <div class="pe">
      <span class="marca"><img src="../public/img/sal-wordmark.svg" alt="SAL"><span id="assin">Blog da SAL</span></span>
      <span class="meta" id="meta"></span>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const titulo = q.get('titulo') || 'Título do artigo';
  const grifo = q.get('grifo') || '';
  const el = document.getElementById('titulo');
  if (grifo && titulo.includes(grifo)) {
    el.innerHTML = titulo.split(grifo).map(t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<span class="grifo">' + grifo.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>');
  } else { el.textContent = titulo; }
  document.getElementById('cat').textContent = q.get('cat') || 'Blog';
  if (q.get('formato') === 'social') {
    document.body.classList.add('social');
    document.getElementById('assin').textContent = '@salestrategias';
    document.getElementById('meta').remove();
  } else {
    document.getElementById('meta').textContent = (q.get('min') || '5') + ' min de leitura';
  }
</script>
</body></html>
